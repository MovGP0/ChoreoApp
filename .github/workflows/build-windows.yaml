name: build-windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update (e.g. v1.2.3). If empty, uses run number."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || format('manual-{0}', github.run_number) }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"
  SOLUTION_PATH: "ChoreoApp.slnx"
  PROJECT_PATH: "ChoreoApp/ChoreoApp.csproj"
  TARGET_FRAMEWORK: "net10.0-windows10.0.19041.0"

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
        self_contained:
          - true
          - false
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        shell: pwsh
        run: |
          dotnet workload install maui
          dotnet workload restore "${{ env.SOLUTION_PATH }}" 

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}"

      - name: Publish Windows
        shell: pwsh
        run: |
          $publishDir = "artifacts/windows/${{ matrix.rid }}/${{ matrix.self_contained }}"
          dotnet publish "${{ env.PROJECT_PATH }}" -c "${{ env.CONFIGURATION }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}" -p:GenerateAppxPackageOnBuild=false -r "${{ matrix.rid }}" --self-contained "${{ matrix.self_contained }}" -o $publishDir

      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $selfContainedLabel = if ('${{ matrix.self_contained }}' -eq 'true') { 'self-contained' } else { 'framework-dependent' }
          $zipName = "windows-${{ matrix.rid }}-$selfContainedLabel.zip"
          Compress-Archive -Path "artifacts/windows/${{ matrix.rid }}/${{ matrix.self_contained }}/*" -DestinationPath "out/$zipName" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}-${{ matrix.self_contained }}
          path: out/*.zip

  release:
    runs-on: windows-2022
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out

      - name: Determine tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.event.inputs.release_tag }}' -ne '') {
            "tag=${{ github.event.inputs.release_tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "tag=manual-${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Publish Release asset (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          files: |
            out/**/*.zip
