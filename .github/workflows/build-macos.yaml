name: build-macos

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create/update (e.g. v1.2.3). If empty, uses run number."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.release_tag || format('manual-{0}', github.run_number) }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: "Release"
  SOLUTION_PATH: "ChoreoApp.slnx"
  PROJECT_PATH: "ChoreoApp/ChoreoApp.csproj"
  TARGET_FRAMEWORK: "net10.0-maccatalyst"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install MAUI workloads
        run: |
          dotnet workload install maui
          dotnet workload restore "${{ env.SOLUTION_PATH }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}"

      - name: Restore
        run: |
          dotnet restore "${{ env.SOLUTION_PATH }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}"

      - name: Publish MacCatalyst
        run: |
          dotnet publish "${{ env.PROJECT_PATH }}" -c "${{ env.CONFIGURATION }}" -p:TargetFramework="${{ env.TARGET_FRAMEWORK }}" -o artifacts/maccatalyst

      - name: Zip
        run: |
          mkdir -p out
          ditto -c -k --sequesterRsrc --keepParent artifacts/maccatalyst out/maccatalyst.zip

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=manual-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Release asset (MacCatalyst)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          files: |
            out/maccatalyst.zip
